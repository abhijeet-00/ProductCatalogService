name: CI/CD Pipeline

on:
  workflow_dispatch:
  # this will trigger workflow whenever a change is pushed to main branch
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Archive
    # Will run steps on latest version of ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Check-out your repository under $GITHUB_WORKSPACE, so your workflow can access it
      - uses: actions/checkout@v4
      # Set up JDK 17 (matches java.version in pom.xml)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Caches ~/.m2/repository keyed on pom.xml
          cache: maven
      # Run the DB-free tests. Integration tests need a real MySQL instance, so they are
      # excluded here and run manually from a terminal when needed.
      - name: Run unit tests
        run: bash ./mvnw -B -ntp test -Dtest='!ProductCatalogServiceApplicationTests,!*IntegrationTests'
      # Build the application using the Maven wrapper pinned in .mvn/wrapper
      - name: Build with Maven
        run: bash ./mvnw -B -ntp package -DskipTests
      - name: Upload JAR
        # We upload so we can re-use same jar in next job.
        uses: actions/upload-artifact@v4
        with:
          # Name of artifact can be anything
          name: artifact
          # Relative path to jar file
          path: target/ProductCatalogService-0.0.1-SNAPSHOT.jar
