server.port=8080

spring.application.name=ProductCatalogService
groq.api.key=${GROQ_API_KEY}

# The JDBC URL of the database (replace 'your_database_name' with your actual database name)
spring.datasource.url=jdbc:mysql://localhost:3306/product_catalog_service

# Database credentials
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Automatically creates, updates, or validates the database schema based on your @Entity classes
# Options: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=validate

# Show generated SQL queries in the console (useful for development)
spring.jpa.show-sql=true

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
dummy.service.url=${DUMMY_SERVICE_URL:https://dummyjson.com}

# Circuit breaker for the dummy product service
resilience4j.circuitbreaker.instances.dummy.sliding-window-size=10
resilience4j.circuitbreaker.instances.dummy.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.dummy.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.dummy.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.dummy.permitted-number-of-calls-in-half-open-state=2

# Flyway configuration for database migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Show the SQL statements executed by Flyway migrations in the console
logging.level.org.flywaydb.core.internal.sqlscript=DEBUG