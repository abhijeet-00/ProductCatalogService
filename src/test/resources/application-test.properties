spring.datasource.url=jdbc:mysql://localhost:3306/product_catalog_service_test?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}

# Test schema is created from scratch by Flyway, so a baseline must never be injected
spring.flyway.baseline-on-migrate=false
spring.jpa.show-sql=false

# @SpringBootTest builds the real beans, so these placeholders must resolve even though
# the integration tests never call Groq.
GROQ_URL=http://localhost:9999
GROQ_API_KEY=test-key
